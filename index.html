<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOOGO - Glaces Artisanales Premium</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e65100">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background:#fff8f6;padding-bottom:170px;color:#2c3e50}
header{background:linear-gradient(135deg, #e8590c, #ff7a00);color:white;text-align:center;padding:20px 12px;border-bottom-left-radius:20px;border-bottom-right-radius:20px;box-shadow:0 4px 15px rgba(232,89,12,0.2)}
header img{width:80px;height:80px;object-fit:cover;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
header h1{margin:8px 0 2px;font-size:28px;font-weight:900;letter-spacing:1px}
.tagline{font-size:13.5px;opacity:.95;margin:4px 0 0;font-style:italic}
.badge-24h{display:inline-block;background:rgba(255,255,255,0.2);backdrop-filter:blur(5px);color:white;font-size:12px;font-weight:bold;padding:6px 14px;border-radius:20px;margin-top:10px;border:1px solid rgba(255,255,255,0.3)}

.section-titre{text-align:center;color:#e8590c;font-size:20px;margin:22px 0 4px;font-weight:800}
.section-sous-titre{text-align:center;color:#7f8c8d;font-size:13px;margin:0 10px 16px}

/* CARTE PRODUIT HAUT DE GAMME */
#produits{padding:0 10px}
.produit-card{background:white;margin-bottom:20px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,0.05);overflow:hidden;border:1px solid #ffe8e0}
.produit-main{display:flex;padding:16px;align-items:center}
.img-wrap{position:relative;width:95px;height:95px;flex-shrink:0;margin-right:15px;cursor:pointer}
.img-wrap img{width:100%;height:100%;border-radius:14px;object-fit:cover}
.zoom-badge{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.6);color:white;font-size:10px;padding:2px 6px;border-radius:8px}

.info{flex:1}
.info h3{margin:0 0 4px;font-size:16px;color:#2c3e50;font-weight:700}
.info .format-label{font-size:12px;color:#95a5a6;margin-bottom:6px;display:block}
.prix-unitaire{font-weight:800;color:#e8590c;font-size:18px;margin-bottom:8px}

.qte-ctrl{display:flex;align-items:center;gap:12px}
.qte-ctrl button{border:0;background:#f0f0f0;color:#2c3e50;width:32px;height:32px;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;transition:all 0.2s}
.qte-ctrl button:active{background:#e8590c;color:white}
.qte-ctrl span{font-weight:bold;font-size:15px;min-width:20px;text-align:center}

/* INTEGRATION PACKS VIP SOUS CHAQUE PRODUIT */
.packs-container{background:#fff7f2;border-top:1px dashed #ffd2c1;padding:12px 16px}
.pack-titre-section{font-size:11.5px;text-transform:uppercase;letter-spacing:0.8px;color:#e8590c;font-weight:bold;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.pack-item{display:flex;justify-content:space-between;align-items:center;background:white;padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid #ffdecb;box-shadow:0 2px 4px rgba(232,89,12,0.04)}
.pack-item:last-child{margin-bottom:0}
.pack-info-nom{font-size:13px;font-weight:700;color:#34495e}
.pack-info-sub{font-size:11px;color:#27ae60;font-weight:600;margin-top:2px}
.btn-pack{background:linear-gradient(135deg, #e8590c, #ff7a00);color:white;border:0;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(232,89,12,0.3);transition:all 0.2s}
.btn-pack.valide{background:#27ae60 !important;box-shadow:0 2px 6px rgba(39,174,96,0.3) !important}

/* FORMULAIRE & TOTAL */
.commande-form{background:white;margin:20px 10px;padding:18px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
.champ-label{display:block;font-size:13px;font-weight:700;color:#34495e;margin:12px 0 6px}
.champ-input{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:10px;font-size:14px;background:#fafafa}
.reception-carte{display:flex;align-items:center;gap:10px;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-top:8px;cursor:pointer}
.reception-carte.selectionnee{border-color:#e8590c;background:#fff8f5}

.total-bar{position:fixed;bottom:0;left:0;right:0;background:white;padding:14px 16px;box-shadow:0 -5px 20px rgba(0,0,0,0.1);z-index:100;border-top-left-radius:20px;border-top-right-radius:20px}
.total-bar h2{margin:0 0 10px;text-align:center;font-size:18px;color:#2c3e50}
.btn-whatsapp{display:block;width:100%;border:0;border-radius:12px;background:#25D366;color:white;padding:15px;font-size:16px;font-weight:bold;cursor:pointer;text-align:center;box-shadow:0 4px 12px rgba(37,211,102,0.3)}

/* ZOOM OVERLAY */
.zoom-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.zoom-overlay.actif{display:flex}
.zoom-overlay img{max-width:90%;max-height:70vh;border-radius:14px}
.zoom-close{position:absolute;top:20px;right:20px;background:white;border:0;width:36px;height:36px;border-radius:50%;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<header>
  <img src="/logo.png" alt="NOOGO">
  <h1>NOOGO</h1>
  <p class="tagline">Des glaces artisanales d'exception 🍦</p>
  <div class="badge-24h">🕒 Service Premium — Ouvert 24h/24</div>
</header>

<h2 class="section-titre">🍨 Nos Créations & Packs VIP</h2>
<p class="section-sous-titre">Commandez à l'unité ou profitez de nos packs avec livraison VIP offerte</p>

<div id="produits"></div>

<div class="commande-form">
  <h3 style="margin:0 0 14px;color:#e8590c;font-size:16px">📍 Informations de livraison</h3>
  
  <label class="champ-label">Nom complet</label>
  <input type="text" id="champ-nom" class="champ-input" placeholder="Ex: M. Ouédraogo">

  <label class="champ-label">Téléphone</label>
  <input type="tel" id="champ-tel" class="champ-input" placeholder="Ex: 70 00 00 00">

  <label class="champ-label">Lieu de livraison / Repère</label>
  <input type="text" id="champ-localisation" class="champ-input" placeholder="Quartier, rue, villa...">

  <label class="champ-label">Mode de réception</label>
  <div class="reception-carte selectionnee" id="card-livraison" onclick="choisirMode('livraison')">
    <input type="radio" name="reception" value="livraison" id="radio-liv" checked>
    <label for="radio-liv">🛵 Livraison à domicile</label>
  </div>
  <div class="reception-carte" id="card-retrait" onclick="choisirMode('retrait')">
    <input type="radio" name="reception" value="retrait" id="radio-ret">
    <label for="radio-ret">🏪 Retrait sur place (Karpala)</label>
  </div>
</div>

<div class="total-bar">
  <h2>Total : <span id="total" style="color:#e8590c;font-weight:900">0</span> FCFA <span id="mention-vip" style="font-size:12px;color:#27ae60;display:block;font-weight:normal"></span></h2>
  <button class="btn-whatsapp" onclick="commander()">Valider la commande sur WhatsApp</button>
</div>

<div class="zoom-overlay" id="zoom-overlay" onclick="fermerZoom()">
  <button class="zoom-close" onclick="fermerZoom()">✕</button>
  <img id="zoom-img" src="" alt="">
  <h3 id="zoom-titre" style="color:white;margin-top:15px;font-size:16px"></h3>
</div>
<script>
let produits = [
  {
    id: "chocolat",
    nom: "Chocolat Cacao au Lait",
    prix125: 600,
    prix250: 1200,
    img: "/produits/Chocolat_Cacao_au_Lait_1200F.jpg",
    qte125: 0,
    qte250: 0,
    packs: [
      { id: "pack_choc_5", nom: "Pack 5 pots (125 ml)", pots: 5, format: "125ml", prix: 5000, qte: 0 },
      { id: "pack_choc_3_gros", nom: "Pack 3 gros pots (250 ml)", pots: 3, format: "250ml", prix: 5000, qte: 0 }
    ]
  },
  {
    id: "vanille",
    nom: "Vanille Lactée Premium",
    prix125: 700,
    prix250: 1400,
    img: "/produits/Vanille_Lacte_1400F.jpg",
    qte125: 0,
    qte250: 0,
    packs: [
      { id: "pack_van_5", nom: "Pack 5 pots (125 ml)", pots: 5, format: "125ml", prix: 5500, qte: 0 },
      { id: "pack_van_3_gros", nom: "Pack 3 gros pots (250 ml)", pots: 3, format: "250ml", prix: 6000, qte: 0 }
    ]
  },
  {
    id: "banane",
    nom: "Fruits Naturels - Banane",
    prix125: 1000,
    prix250: 2000,
    img: "/produits/Fruits_Naturel_Banane_2000F.jpg",
    qte125: 0,
    qte250: 0,
    packs: [
      { id: "pack_ban_5", nom: "Pack 5 pots (125 ml)", pots: 5, format: "125ml", prix: 7000, qte: 0 },
      { id: "pack_ban_3_gros", nom: "Pack 3 gros pots (250 ml)", pots: 3, format: "250ml", prix: 7500, qte: 0 }
    ]
  }
];

let modeReception = "livraison";
let fraisLivraisonStandard = 1500;

function afficher() {
  let html = "";
  produits.forEach((p, index) => {
    html += `
    <div class="produit-card">
      <div class="produit-main">
        <div class="img-wrap" onclick="agrandir('${p.img}', '${p.nom}')">
          <img src="${p.img}" alt="${p.nom}">
          <span class="zoom-badge">🔍 Zoom</span>
        </div>
        <div class="info">
          <h3>${p.nom}</h3>
          
          <span class="format-label">Pot Unitaire 125 ml</span>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <span class="prix-unitaire">${p.prix125.toLocaleString('fr-FR')} FCFA</span>
            <div class="qte-ctrl">
              <button onclick="changerQte(${index}, '125', -1)">-</button>
              <span>${p.qte125}</span>
              <button onclick="changerQte(${index}, '125', 1)">+</button>
            </div>
          </div>

          <span class="format-label">Grand Pot 250 ml (Double)</span>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="prix-unitaire">${p.prix250.toLocaleString('fr-FR')} FCFA</span>
            <div class="qte-ctrl">
              <button onclick="changerQte(${index}, '250', -1)">-</button>
              <span>${p.qte250}</span>
              <button onclick="changerQte(${index}, '250', 1)">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="packs-container">
        <div class="pack-titre-section">✨ Packs VIP Promo (${p.nom})</div>
        ${p.packs.map((pack, pIndex) => `
          <div class="pack-item">
            <div>
              <div class="pack-info-nom">${pack.nom}</div>
              <div class="pack-info-sub">🚚 Livraison VIP incluse</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-weight:bold;color:#e8590c;font-size:14px">${pack.prix.toLocaleString('fr-FR')} F</span>
              <button class="btn-pack" id="btn-pack-${index}-${pIndex}" onclick="ajouterPack(${index}, ${pIndex}, this)">
                ${pack.qte > 0 ? 'Ajouté (' + pack.qte + ')' : '+ Sélectionner'}
              </button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  });

  document.getElementById("produits").innerHTML = html;
  calculerTotal();
}
  function changerQte(pIndex, format, val) {
  if (format === '125') {
    produits[pIndex].qte125 = Math.max(0, produits[pIndex].qte125 + val);
  } else {
    produits[pIndex].qte250 = Math.max(0, produits[pIndex].qte250 + val);
  }
  afficher();
}

function ajouterPack(pIndex, packIndex, btnEl) {
  produits[pIndex].packs[packIndex].qte += 1;
  btnEl.classList.add('valide');
  btnEl.innerHTML = "✅ Validé !";
  
  setTimeout(() => {
    afficher();
  }, 800);
}

function choisirMode(mode) {
  modeReception = mode;
  document.getElementById('card-livraison').classList.toggle('selectionnee', mode === 'livraison');
  document.getElementById('card-retrait').classList.toggle('selectionnee', mode === 'retrait');
  document.getElementById('radio-liv').checked = (mode === 'livraison');
  document.getElementById('radio-ret').checked = (mode === 'retrait');
  calculerTotal();
}

function calculerTotal() {
  let totalProduitsSeuls = 0;
  let totalPacks = 0;
  let aDesPacks = false;
  let articlesCount = 0;

  produits.forEach(p => {
    totalProduitsSeuls += (p.qte125 * p.prix125) + (p.qte250 * p.prix250);
    if(p.qte125 > 0 || p.qte250 > 0) articlesCount++;
    
    p.packs.forEach(pack => {
      if (pack.qte > 0) {
        totalPacks += (pack.qte * pack.prix);
        aDesPacks = true;
        articlesCount += pack.qte;
      }
    });
  });

  let totalFinal = totalProduitsSeuls + totalPacks;
  let mentionVip = document.getElementById('mention-vip');

  if (articlesCount > 0 && modeReception === 'livraison') {
    if (aDesPacks) {
      mentionVip.textContent = "✨ Livraison VIP incluse dans votre Pack !";
    } else {
      totalFinal += fraisLivraisonStandard;
      mentionVip.textContent = "+ 1 500 FCFA de livraison standard";
    }
  } else {
    mentionVip.textContent = "";
  }

  document.getElementById('total').textContent = totalFinal.toLocaleString('fr-FR');
}

function commander() {
  let nom = document.getElementById('champ-nom').value;
  let tel = document.getElementById('champ-tel').value;
  let loc = document.getElementById('champ-localisation').value;

  let texte = "*NOUVELLE COMMANDE VIP - NOOGO*\n\n";
  if (nom) texte += `👤 *Client:* ${nom}\n`;
  if (tel) texte += `📞 *Contact:* ${tel}\n`;
  if (loc) texte += `📍 *Adresse:* ${loc}\n`;
  texte += `🛵 *Mode:* ${modeReception === 'livraison' ? 'Livraison à domicile' : 'Retrait sur place'}\n`;
  texte += "-----------------------------------\n";
  texte += "*DÉTAILS DU PANIER :*\n\n";

  let totalGeneral = 0;

  produits.forEach(p => {
    if (p.qte125 > 0) {
      let st = p.qte125 * p.prix125;
      totalGeneral += st;
      texte += `• ${p.nom} (125ml) x${p.qte125} : ${st.toLocaleString('fr-FR')} FCFA\n`;
    }
    if (p.qte250 > 0) {
      let st = p.qte250 * p.prix250;
      totalGeneral += st;
      texte += `• ${p.nom} (250ml) x${p.qte250} : ${st.toLocaleString('fr-FR')} FCFA\n`;
    }
    p.packs.forEach(pack => {
      if (pack.qte > 0) {
        let st = pack.qte * pack.prix;
        totalGeneral += st;
        let partLivraison = 1500 * pack.qte;
        let partProduit = st - partLivraison;
        texte += `🌟 *${pack.nom} (${p.nom})* x${pack.qte} : ${st.toLocaleString('fr-FR')} FCFA\n`;
        texte += `   ↳ _Detail: Glaces ${partProduit.toLocaleString('fr-FR')} F | Livraison VIP: ${partLivraison.toLocaleString('fr-FR')} F_\n`;
      }
    });
  });

  if (totalGeneral === 0) {
    alert("Votre panier est vide. Veuillez ajouter un produit ou un pack !");
    return;
  }

  let totalAffiche = document.getElementById('total').textContent;
  texte += "\n-----------------------------------\n";
  texte += `💰 *TOTAL NET À PAYER : ${totalAffiche} FCFA*`;

  let url = `https://wa.me/22661682706?text=${encodeURIComponent(texte)}`;
  window.open(url, '_blank');
}

function agrandir(src, titre) {
  document.getElementById('zoom-img').src = src;
  document.getElementById('zoom-titre').textContent = titre;
  document.getElementById('zoom-overlay').classList.add('actif');
}

function fermerZoom() {
  document.getElementById('zoom-overlay').classList.remove('actif');
}

afficher();
</script>

</body>
</html>
