<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noogo — Boutique</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8f0;color:#333;padding-bottom:100px}
header{background:#e8590c;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:18px}
.conteneur{max-width:500px;margin:0 auto;padding:12px}
.carte-produit{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;gap:12px;align-items:center;position:relative}

.carte-produit.est-pack{
  border:2.5px solid #e8590c;
  background:linear-gradient(135deg, #fff9f5 0%, #ffffff 100%);
}

.badge-nb-boites{
  position:absolute;
  top:10px;
  right:10px;
  background:#e8590c;
  color:#fff;
  font-size:12px;
  font-weight:800;
  padding:5px 10px;
  border-radius:20px;
  box-shadow:0 2px 5px rgba(232,89,12,0.4);
  z-index:2;
}

.pack-photos-grille{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:2px;
  width:90px;
  height:90px;
  border-radius:10px;
  overflow:hidden;
  border:2px solid #e8590c;
  background:#fff;
  flex-shrink:0;
}
.pack-photos-grille img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.pack-photos-grille.deux-photos{
  grid-template-columns:1fr 1fr;
}

.img-produit-simple{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  flex-shrink:0;
}

.infos-produit{flex:1}
.nom-produit{font-size:15px;font-weight:700;margin:0 0 4px;color:#333}
.prix-produit{font-size:15px;font-weight:800;color:#e8590c;margin-top:4px}

.barre-panier{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;box-shadow:0 -4px 10px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:8px;z-index:100}
.btn-commander{background:#2e7d32;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;width:100%;cursor:pointer;text-align:center}
</style>
</head>
<body>

<header><h1>🍦 Noogo — Commandes</h1></header>

<div class="conteneur" id="liste-catalogue"></div>

<div class="barre-panier">
  <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;">
    <span>Total :</span>
    <span id="total-prix" style="color:#e8590c;">0 FCFA</span>
  </div>
  <button class="btn-commander" onclick="commanderWhatsApp()">💬 Commander sur WhatsApp</button>
</div>
<script>
const CATALOGUE = [
  {id:"banane-p",  cat:"Petits Pots", nom:"Crème Glacée Banane", prix:1000},
  {id:"vanille-p", cat:"Petits Pots", nom:"Crème Glacée Vanille", prix:700},
  {id:"choco-p",   cat:"Petits Pots", nom:"Crème Glacée Chocolat", prix:600},
  {id:"fraise-p",  cat:"Petits Pots", nom:"Crème Glacée Fraise", prix:700},
  {id:"pk-ban-p",  cat:"Packs", nom:"🎁 Pack Banane Petit Format", prix:7000, nb:"5 Pots"},
  {id:"pk-van-p",  cat:"Packs", nom:"🎁 Pack Vanille Petit Format", prix:5500, nb:"5 Pots"},
  {id:"pk-cho-p",  cat:"Packs", nom:"🎁 Pack Chocolat Petit Format", prix:5000, nb:"5 Pots"},
  {id:"pk-fra-p",  cat:"Packs", nom:"🎁 Pack Fraise Petit Format", prix:5500, nb:"5 Pots"},
  {id:"pk-mix-p",  cat:"Packs", nom:"🎁 Pack Découverte Mix Petit", prix:6000, nb:"Mix 5 Pots"},
  {id:"ceremonie", cat:"Gros Format", nom:"🎁 Pack Fête / Cérémonie", prix:72000, nb:"2 Seaux"}
];

let panier = {};

function afficherCatalogue() {
  let html = "";
  CATALOGUE.forEach(p => {
    const isPack = p.id.startsWith("pk-") || p.id === "ceremonie";
    const isMix = p.id.includes("mix");
    const qte = panier[p.id] || 0;

    let htmlVisuel = "";
    if (isMix) {
      htmlVisuel = `
        <div class="pack-photos-grille">
          <img src="produits/vanille-p.jpg" alt="Vanille">
          <img src="produits/choco-p.jpg" alt="Chocolat">
          <img src="produits/fraise-p.jpg" alt="Fraise">
          <img src="produits/banane-p.jpg" alt="Banane">
        </div>`;
    } else if (isPack) {
      let imgRef = p.id.includes("ban") ? "banane-p.jpg" : (p.id.includes("cho") ? "choco-p.jpg" : (p.id.includes("fra") ? "fraise-p.jpg" : "vanille-p.jpg"));
      if(p.id === "ceremonie") imgRef = "creme-6250.jpg";
      
      htmlVisuel = `
        <div class="pack-photos-grille ${p.id === 'ceremonie' ? 'deux-photos' : ''}">
          <img src="produits/${imgRef}" alt="Pot">
          <img src="produits/${imgRef}" alt="Pot">
          ${p.id !== 'ceremonie' ? `<img src="produits/${imgRef}" alt="Pot"><img src="produits/${imgRef}" alt="Pot">` : ''}
        </div>`;
    } else {
      htmlVisuel = `<img src="produits/${p.id}.jpg" alt="${p.nom}" class="img-produit-simple">`;
    }

    html += `
      <div class="carte-produit ${isPack ? 'est-pack' : ''}">
        ${isPack ? `<div class="badge-nb-boites">📦 ${p.nb}</div>` : ''}
        ${htmlVisuel}
        <div class="infos-produit">
          <h3 class="nom-produit">${p.nom}</h3>
          <div class="prix-produit">${p.prix.toLocaleString("fr-FR")} FCFA</div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
            <button onclick="modifierQte('${p.id}', -1)" style="width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer">-</button>
            <span style="font-weight:700;font-size:15px">${qte}</span>
            <button onclick="modifierQte('${p.id}', 1)" style="width:30px;height:30px;border-radius:50%;border:0;background:#e8590c;color:#fff;font-weight:bold;cursor:pointer">+</button>
          </div>
        </div>
      </div>`;
  });
  document.getElementById("liste-catalogue").innerHTML = html;
  calculerTotal();
}

function modifierQte(id, delta) {
  if (!panier[id]) panier[id] = 0;
  panier[id] += delta;
  if (panier[id] <= 0) delete panier[id];
  afficherCatalogue();
}

function calculerTotal() {
  let total = 0;
  for (let id in panier) {
    const prod = CATALOGUE.find(p => p.id === id);
    if (prod) total += prod.prix * panier[id];
  }
  document.getElementById("total-prix").innerText = total.toLocaleString("fr-FR") + " FCFA";
}

function commanderWhatsApp() {
  let texte = "Bonjour Noogo, je souhaite commander :%0A";
  let total = 0;
  for (let id in panier) {
    const prod = CATALOGUE.find(p => p.id === id);
    if (prod && panier[id] > 0) {
      texte += `- ${prod.nom} x${panier[id]} (${(prod.prix * panier[id]).toLocaleString("fr-FR")} FCFA)%0A`;
      total += prod.prix * panier[id];
    }
  }
  if (total === 0) {
    alert("Votre panier est vide !");
    return;
  }
  texte += `%0ATotal : ${total.toLocaleString("fr-FR")} FCFA`;
  window.open(`https://wa.me/22600000000?text=${texte}`, '_blank');
}

afficherCatalogue();
</script>
</body>
</html>
