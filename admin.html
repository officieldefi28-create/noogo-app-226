<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noogo — Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8f0;color:#333;padding-bottom:40px}
header{background:#e8590c;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:20px}
.conteneur{max-width:480px;margin:0 auto;padding:14px}
.carte{background:white;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 7px rgba(0,0,0,.1)}
.carte h2{margin:0 0 12px;font-size:16px;color:#e8590c}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.btn{width:100%;background:#e8590c;color:white;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:bold;margin-top:14px}
.btn-secondaire{background:#666}
.btn-vert{background:#2e7d32}
.btn-rouge{background:#c62828}
.btn-bleu{background:#1565c0}
.btn-petit{width:auto;padding:7px 12px;font-size:12px;margin:4px 4px 0 0;border-radius:20px}
.ligne-partenaire,.ligne-commande{border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge-attente{background:#fff3e0;color:#e65100}
.badge-livree{background:#e8f5e9;color:#2e7d32}
.badge-annulee{background:#ffebee;color:#c62828}
.badge-paye{background:#e3f2fd;color:#1565c0}
.badge-impaye{background:#fce4ec;color:#ad1457}
.erreur{background:#ffebee;color:#c62828;padding:10px;border-radius:8px;font-size:13px;margin-top:10px;word-break:break-word}
.succes{background:#e8f5e9;color:#2e7d32;padding:10px;border-radius:8px;font-size:13px;margin-top:10px}
.jours-case{display:inline-flex;align-items:center;gap:4px;margin:4px 6px 0 0;font-size:12px;font-weight:normal}
.cachee{display:none}
.mdp-affiche{background:#fff3e0;padding:10px;border-radius:8px;font-size:14px;font-weight:bold;text-align:center;margin-top:10px}
.overlay-modif{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px}
.overlay-modif.actif{display:flex}
.modif-carte{background:white;border-radius:14px;padding:16px;max-width:420px;width:100%;margin-top:20px}
.modif-carte h2{margin:0 0 12px;font-size:16px;color:#e8590c}
</style>
</head>
<body>

<header><h1>🔐 Noogo — Espace Admin</h1></header>

<div class="conteneur">

<div class="carte" id="carte-login">
<h2>Connexion</h2>
<label>Mot de passe administrateur</label>
<input type="password" id="mdp-admin" placeholder="Mot de passe">
<button class="btn" onclick="connexionAdmin()">Se connecter</button>
<div id="erreur-login"></div>
</div>

<div id="zone-admin" class="cachee">

<div id="alerte-reclamations"></div>

<div class="carte">
<h2>⚡ Configuration rapide</h2>
<button class="btn btn-secondaire" onclick="creerCodesAutomatiques()">Créer les codes Mardi/Samedi/FB/TT (100 FCFA)</button>
<div id="resultat-codes-auto"></div>
</div>

<div class="carte">
<h2>➕ Nouveau partenaire</h2>
<label>Nom</label>
<input type="text" id="np-nom" placeholder="Ex : École Saint Joseph">
<label>Numéro de téléphone (identifiant de connexion)</label>
<input type="tel" id="np-tel" placeholder="Ex : 70123456">
<label>Type</label>
<select id="np-type">
<option value="particulier">Particulier</option>
<option value="personnel">Personnel</option>
<option value="ecole">École</option>
<option value="entreprise">Entreprise</option>
</select>
<label>Code promo</label>
<input type="text" id="np-code" placeholder="Ex : ECOLE01">
<label>Type de réduction client</label>
<select id="np-remise-type">
<option value="pourcentage">Pourcentage (%)</option>
<option value="fixe">Montant fixe (FCFA)</option>
</select>
<label>Valeur de la réduction</label>
<input type="number" id="np-remise-valeur" placeholder="Ex : 10">
<label>Type de commission partenaire</label>
<select id="np-commission-type">
<option value="pourcentage">Pourcentage (%)</option>
<option value="fixe">Montant fixe (FCFA)</option>
</select>
<label>Valeur de la commission</label>
<input type="number" id="np-commission-valeur" placeholder="Ex : 5">
<label>Jours actifs (laisser vide = tous les jours)</label>
<div>
<label class="jours-case"><input type="checkbox" value="0" class="np-jour"> Dim</label>
<label class="jours-case"><input type="checkbox" value="1" class="np-jour"> Lun</label>
<label class="jours-case"><input type="checkbox" value="2" class="np-jour"> Mar</label>
<label class="jours-case"><input type="checkbox" value="3" class="np-jour"> Mer</label>
<label class="jours-case"><input type="checkbox" value="4" class="np-jour"> Jeu</label>
<label class="jours-case"><input type="checkbox" value="5" class="np-jour"> Ven</label>
<label class="jours-case"><input type="checkbox" value="6" class="np-jour"> Sam</label>
</div>
<button class="btn" onclick="creerPartenaire()">Créer le partenaire</button>
<div id="resultat-creation"></div>
</div>

<div class="carte">
<h2>👥 Partenaires</h2>
<div id="liste-partenaires">Chargement...</div>
</div>

<div class="carte">
<h2>📦 Commandes récentes</h2>
<div style="display:flex;gap:8px;margin-bottom:10px">
<select id="tri-commandes" onchange="rafraichirAffichageCommandes()" style="flex:1">
<option value="recent">Plus récentes d'abord</option>
<option value="ancien">Plus anciennes d'abord</option>
</select>
</div>
<div id="liste-commandes">Chargement...</div>
<button class="btn btn-secondaire" id="btn-archives" onclick="basculerArchives()">Voir les commandes archivées</button>
</div>

</div>

</div>

<div class="overlay-modif" id="overlay-modif">
<div class="modif-carte">
<h2>✏️ Modifier le partenaire</h2>
<input type="hidden" id="mp-id">
<label>Nom</label>
<input type="text" id="mp-nom">
<label>Numéro de téléphone</label>
<input type="tel" id="mp-tel">
<label>Type</label>
<select id="mp-type">
<option value="particulier">Particulier</option>
<option value="personnel">Personnel</option>
<option value="ecole">École</option>
<option value="entreprise">Entreprise</option>
</select>
<label>Code promo</label>
<input type="text" id="mp-code">
<label>Type de réduction client</label>
<select id="mp-remise-type">
<option value="pourcentage">Pourcentage (%)</option>
<option value="fixe">Montant fixe (FCFA)</option>
</select>
<label>Valeur de la réduction</label>
<input type="number" id="mp-remise-valeur">
<label>Type de commission partenaire</label>
<select id="mp-commission-type">
<option value="pourcentage">Pourcentage (%)</option>
<option value="fixe">Montant fixe (FCFA)</option>
</select>
<label>Valeur de la commission</label>
<input type="number" id="mp-commission-valeur">
<label>Jours actifs (laisser vide = tous les jours)</label>
<div>
<label class="jours-case"><input type="checkbox" value="0" class="mp-jour"> Dim</label>
<label class="jours-case"><input type="checkbox" value="1" class="mp-jour"> Lun</label>
<label class="jours-case"><input type="checkbox" value="2" class="mp-jour"> Mar</label>
<label class="jours-case"><input type="checkbox" value="3" class="mp-jour"> Mer</label>
<label class="jours-case"><input type="checkbox" value="4" class="mp-jour"> Jeu</label>
<label class="jours-case"><input type="checkbox" value="5" class="mp-jour"> Ven</label>
<label class="jours-case"><input type="checkbox" value="6" class="mp-jour"> Sam</label>
</div>
<button class="btn" onclick="enregistrerModification()">Enregistrer</button>
<button class="btn btn-secondaire" onclick="fermerModif()">Annuler</button>
<div id="resultat-modif"></div>
</div>
</div>

<script>

let mdpAdmin = "";

function connexionAdmin(){
  mdpAdmin = document.getElementById("mdp-admin").value;
  if (mdpAdmin === "delfioficiel") {
    document.getElementById("carte-login").classList.add("cachee");
    document.getElementById("zone-admin").classList.remove("cachee");
    rafraichirTout();
  } else {
    document.getElementById("erreur-login").innerHTML = `<div class="erreur">Mot de passe incorrect</div>`;
  }
}

function appelAdmin(action, donneesSupplementaires){
let corps = Object.assign({ motDePasseAdmin: mdpAdmin, action: action }, donneesSupplementaires || {});
return fetch("/api/admin", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(corps)
}).then(r => r.json().then(d => ({ ok: r.ok, d })));
}

let dernierePartenairesListe = [];
let dernieresCommandesListe = [];
let archivesVisibles = false;

function rafraichirTout(){
appelAdmin("tout_voir").then(({ ok, d }) => {
if(ok){
dernierePartenairesListe = d.partenaires || [];
dernieresCommandesListe = d.commandes || [];
afficherPartenaires(d.partenaires || []);
rafraichirAffichageCommandes();
} else {
document.getElementById("liste-partenaires").innerHTML = "<p>Erreur : " + (d.erreur || "") + " " + (d.details || "") + "</p>";
document.getElementById("liste-commandes").innerHTML = "<p>Erreur : " + (d.erreur || "") + " " + (d.details || "") + "</p>";
}
}).catch((err) => {
document.getElementById("liste-partenaires").innerHTML = "<p>Impossible de se connecter à la base de données. " + err.message + "</p>";
document.getElementById("liste-commandes").innerHTML = "<p>Impossible de se connecter à la base de données. " + err.message + "</p>";
});
}

function rafraichirAffichageCommandes(){
let tri = document.getElementById("tri-commandes").value;
let liste = dernieresCommandesListe.slice();
liste.sort((a, b) => tri === "recent" ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
if(!archivesVisibles){
liste = liste.slice(0, 15);
}
afficherCommandes(liste, dernierePartenairesListe);
document.getElementById("btn-archives").innerText = archivesVisibles
? "Masquer les archives (afficher seulement les 15 dernières)"
: "Voir les commandes archivées (" + Math.max(0, dernieresCommandesListe.length - 15) + " de plus)";
}

function basculerArchives(){
archivesVisibles = !archivesVisibles;
rafraichirAffichageCommandes();
}

function supprimerCommande(id){
if(!confirm("Supprimer définitivement cette commande ?")) return;
appelAdmin("supprimer_commande", { commandeId: id }).then(({ ok, d }) => {
if(!ok){
alert("Erreur : " + (d.erreur || ""));
return;
}
rafraichirTout();
});
}

function creerCodesAutomatiques(){
appelAdmin("creer_codes_automatiques").then(({ ok, d }) => {
let zone = document.getElementById("resultat-codes-auto");
if(!ok){
zone.innerHTML = `<div class="erreur">${d.erreur} ${d.details || ""}</div>`;
return;
}
zone.innerHTML = `<div class="succes">Fait ! ${d.resultats.map(r => r.code + " : " + r.statut).join(" — ")}</div>`;
rafraichirTout();
});
}

function creerPartenaire(){
let jours = Array.from(document.querySelectorAll(".np-jour:checked")).map(c => Number(c.value));
let donnees = {
nom: document.getElementById("np-nom").value,
telephone: document.getElementById("np-tel").value,
type: document.getElementById("np-type").value,
code: document.getElementById("np-code").value,
remiseType: document.getElementById("np-remise-type").value,
remiseValeur: document.getElementById("np-remise-valeur").value,
commissionType: document.getElementById("np-commission-type").value,
commissionValeur: document.getElementById("np-commission-valeur").value,
joursActifs: jours
};
appelAdmin("creer_partenaire", donnees).then(({ ok, d }) => {
let zone = document.getElementById("resultat-creation");
if(!ok){
zone.innerHTML = `<div class="erreur">${d.erreur} ${d.details || ""}</div>`;
return;
}
zone.innerHTML = `
<div class="succes">Partenaire créé : ${d.partenaire.nom}</div>
<div class="mdp-affiche">
Mot de passe temporaire pour ${d.partenaire.nom} :<br>${d.motDePasseTemporaire}<br>
<small>Communiquez-le au partenaire, il pourra le changer plus tard.</small>
</div>
`;
rafraichirTout();
});
}

function basculerActif(id){
appelAdmin("basculer_actif", { partenaireId: id }).then(() => rafraichirTout());
}

function reinitialiserMotDePasse(id, nom){
appelAdmin("reinitialiser_mot_de_passe", { partenaireId: id }).then(({ ok, d }) => {
if(ok){
alert(`Nouveau mot de passe pour ${nom} : ${d.motDePasseTemporaire}`);
}
});
}

function payerToutLeSolde(id, nom){
if(!confirm(`Marquer tout le solde de ${nom} comme payé ?`)) return;
appelAdmin("payer_tout_le_solde", { partenaireId: id }).then(() => rafraichirTout());
}

function supprimerPartenaire(id, nom){
if(!confirm(`Supprimer définitivement ${nom} ? Cette action est irréversible.`)) return;
appelAdmin("supprimer_partenaire", { partenaireId: id }).then(({ ok, d }) => {
if(!ok){
alert("Erreur : " + (d.erreur || ""));
return;
}
rafraichirTout();
});
}

function ouvrirModif(id){
let p = dernierePartenairesListe.find(x => x.id === id);
if(!p) return;

document.getElementById("mp-id").value = p.id;
document.getElementById("mp-nom").value = p.nom || "";
document.getElementById("mp-tel").value = p.telephone || "";
document.getElementById("mp-type").value = p.type || "particulier";
document.getElementById("mp-code").value = p.code || "";
document.getElementById("mp-remise-type").value = p.remiseType || "pourcentage";
document.getElementById("mp-remise-valeur").value = p.remiseValeur || 0;
document.getElementById("mp-commission-type").value = p.commissionType || "pourcentage";
document.getElementById("mp-commission-valeur").value = p.commissionValeur || 0;

document.querySelectorAll(".mp-jour").forEach(c => {
c.checked = (p.joursActifs || []).includes(Number(c.value));
});

document.getElementById("resultat-modif").innerHTML = "";
document.getElementById("overlay-modif").classList.add("actif");
}

function fermerModif(){
document.getElementById("overlay-modif").classList.remove("actif");
}

function enregistrerModification(){
let jours = Array.from(document.querySelectorAll(".mp-jour:checked")).map(c => Number(c.value));
let donnees = {
partenaireId: document.getElementById("mp-id").value,
nom: document.getElementById("mp-nom").value,
telephone: document.getElementById("mp-tel").value,
type: document.getElementById("mp-type").value,
code: document.getElementById("mp-code").value,
remiseType: document.getElementById("mp-remise-type").value,
remiseValeur: document.getElementById("mp-remise-valeur").value,
commissionType: document.getElementById("mp-commission-type").value,
commissionValeur: document.getElementById("mp-commission-valeur").value,
joursActifs: jours
};
appelAdmin("modifier_partenaire", donnees).then(({ ok, d }) => {
let zone = document.getElementById("resultat-modif");
if(!ok){
zone.innerHTML = `<div class="erreur">${d.erreur || ""} ${d.details || ""}</div>`;
return;
}
fermerModif();
rafraichirTout();
});
}

function validerLivraison(id){
appelAdmin("valider_livraison", { commandeId: id }).then(() => rafraichirTout());
}

function annulerCommande(id){
if(!confirm("Annuler cette commande ?")) return;
appelAdmin("annuler_commande", { commandeId: id }).then(() => rafraichirTout());
}

function marquerCommissionPayee(id){
appelAdmin("marquer_commission_payee", { commandeId: id }).then(() => rafraichirTout());
}

function afficherPartenaires(partenaires){
let zone = document.getElementById("liste-partenaires");
let zoneAlerte = document.getElementById("alerte-reclamations");

let enReclamation = partenaires.filter(p => p.reclamationEnCours);
if(enReclamation.length > 0){
zoneAlerte.innerHTML = `
<div class="carte" style="border:2px solid #c62828">
<h2 style="color:#c62828">🔔 ${enReclamation.length} partenaire(s) réclament leur paiement</h2>
${enReclamation.map(p => `<div>• <strong>${p.nom}</strong> (${p.code}) — depuis le ${new Date(p.reclamationDate).toLocaleString("fr-FR")}</div>`).join("")}
</div>
`;
} else {
zoneAlerte.innerHTML = "";
}

if(!partenaires || partenaires.length === 0){
zone.innerHTML = "<p>Aucun partenaire pour l'instant.</p>";
return;
}
zone.innerHTML = partenaires.map(p => `
<div class="ligne-partenaire" ${p.reclamationEnCours ? 'style="border:2px solid #c62828"' : ""}>
${p.reclamationEnCours ? '<div class="badge badge-annulee" style="margin-bottom:6px">🔔 Réclame son paiement</div><br>' : ""}
<strong>${p.nom}</strong> — ${p.code}<br>
📞 ${p.telephone} — ${p.type}<br>
Réduction : ${p.remiseValeur}${p.remiseType === "pourcentage" ? "%" : " FCFA"} —
Commission : ${p.commissionValeur}${p.commissionType === "pourcentage" ? "%" : " FCFA"}<br>
${p.actif ? '<span class="badge badge-livree">Actif</span>' : '<span class="badge badge-annulee">Désactivé</span>'}
<div>
<button class="btn-petit ${p.actif ? 'btn-rouge' : 'btn-vert'}" onclick="basculerActif('${p.id}')">${p.actif ? 'Désactiver' : 'Activer'}</button>
<button class="btn-petit btn-bleu" onclick="ouvrirModif('${p.id}')">Modifier</button>
<button class="btn-petit btn-secondaire" onclick="reinitialiserMotDePasse('${p.id}','${p.nom}')">Réinitialiser mot de passe</button>
<button class="btn-petit btn-vert" onclick="payerToutLeSolde('${p.id}','${p.nom}')">Payer tout le solde</button>
<button class="btn-petit btn-rouge" onclick="supprimerPartenaire('${p.id}','${p.nom}')">Supprimer</button>
</div>
</div>
`).join("");
}

function afficherCommandes(commandes, partenaires){
let zone = document.getElementById("liste-commandes");
if(!commandes || commandes.length === 0){
zone.innerHTML = "<p>Aucune commande pour l'instant.</p>";
return;
}
zone.innerHTML = commandes.map(c => {
let badgeLivraison = c.statutLivraison === "livree"
? '<span class="badge badge-livree">Livrée</span>'
: c.statutLivraison === "annulee"
? '<span class="badge badge-annulee">Annulée</span>'
: '<span class="badge badge-attente">En attente</span>';
let badgeCommission = c.commission > 0
? (c.statutCommission === "paye"
? '<span class="badge badge-paye">Commission payée</span>'
: '<span class="badge badge-impaye">Commission impayée</span>')
: "";
let partenaireLie = partenaires.find(p => p.id === c.partenaireId);
let ligneOrigine = "";
if(c.code){
if(partenaireLie && partenaireLie.auto){
ligneOrigine = `🤖 Code automatique <strong>${c.code}</strong> (aucune commission — pour vous-même)`;
} else if(partenaireLie){
ligneOrigine = `🤝 Partenaire : <strong>${partenaireLie.nom}</strong> (code ${c.code})`;
} else {
ligneOrigine = `Code ${c.code} (partenaire supprimé)`;
}
}
return `
<div class="ligne-commande">
${new Date(c.date).toLocaleString("fr-FR")}<br>
${c.nomClient ? "👤 " + c.nomClient + " — " : ""}📞 ${c.telClient || "non renseigné"}<br>
${c.localisation ? "📍 " + c.localisation + "<br>" : ""}
${c.modePaiement ? "💳 " + (c.modePaiement === "orange" ? "Orange Money" : c.modePaiement === "wave" ? "Wave" : "Espèces") + "<br>" : ""}
Total : ${c.montantTotal.toLocaleString("fr-FR")} FCFA
${c.code ? ` — réduction ${c.remise.toLocaleString("fr-FR")} FCFA` : ""}<br>
${ligneOrigine ? ligneOrigine + "<br>" : ""}
${badgeLivraison} ${badgeCommission}
<div>
${c.statutLivraison === "en_attente" ? `<button class="btn-petit btn-vert" onclick="validerLivraison('${c.id}')">Valider la livraison</button>
<button class="btn-petit btn-rouge" onclick="annulerCommande('${c.id}')">Annuler</button>` : ""}
${c.statutLivraison === "livree" && c.commission > 0 && c.statutCommission === "impaye" ? `<button class="btn-petit btn-secondaire" onclick="marquerCommissionPayee('${c.id}')">Marquer commission payée</button>` : ""}
<button class="btn-petit btn-rouge" onclick="supprimerCommande('${c.id}')">Supprimer</button>
</div>
</div>
`;
}).join("");
}

</script>
<script>
let afficherCommandesOriginal = afficherCommandes;
afficherCommandes = function(commandes, partenaires){
afficherCommandesOriginal(commandes, partenaires);
let zone = document.getElementById("liste-commandes");
let lignes = zone.querySelectorAll(".ligne-commande");
commandes.forEach(function(c, i){
if(c.source && c.source !== "direct" && lignes[i]){
let div = document.createElement("div");
div.innerHTML = "🔗 Source : " + c.source;
lignes[i].appendChild(div);
}
});
};
</script>
<script>
(function(){

let rafraichirAffichageCommandesOriginal = rafraichirAffichageCommandes;
rafraichirAffichageCommandes = function(){
let tri = document.getElementById("tri-commandes").value;
let liste = dernieresCommandesListe.filter(c => window.archivesCommandesVisibles ? c.archive : !c.archive);
liste.sort((a, b) => tri === "recent" ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
afficherCommandes(liste, dernierePartenairesListe);
let totalArchivees = dernieresCommandesListe.filter(c => c.archive).length;
let btn = document.getElementById("btn-archives");
if(btn){
btn.innerText = window.archivesCommandesVisibles ? "Masquer les archives" : "Voir les commandes archivées (" + totalArchivees + ")";
btn.onclick = function(){ window.archivesCommandesVisibles = !window.archivesCommandesVisibles; rafraichirAffichageCommandes(); };
}
};

window.archivesCommandesVisibles = false;

let afficherCommandesOriginal = afficherCommandes;
afficherCommandes = function(commandes, partenaires){
afficherCommandesOriginal(commandes, partenaires);
let zone = document.getElementById("liste-commandes");
let lignes = zone.querySelectorAll(".ligne-commande");
commandes.forEach(function(c, i){
if(!lignes[i]) return;
let boutonsDiv = lignes[i].querySelector("div:last-child");
if(!boutonsDiv) return;
let btnArchive = document.createElement("button");

<script>
(function() {

        e.preventDefault();
        e.stopPropagation();

        // Demander le nouveau mot de passe à l'administrateur
        let nouveauMdp = prompt("Saisissez le NOUVEAU mot de passe pour ce partenaire :");

        if (nouveauMdp && nouveauMdp.trim() !== "") {
          let motDePasseNettoye = nouveauMdp.trim();

          // Récupération de la liste des partenaires sauvegardés
          let partenaires = JSON.parse(localStorage.getItem("partenaires")) || [];

          // Recherche de la carte du partenaire ciblé dans le HTML
          let cartePartenaire = e.target.closest("[data-id]") || e.target.parentElement;
          let nomPartenaire = cartePartenaire ? cartePartenaire.innerText : "";

          // Mise à jour dans la base de données (localStorage)
          let misAJour = false;
          partenaires = partenaires.map(p => {
            if (nomPartenaire.includes(p.nom) || nomPartenaire.includes(p.code)) {
              p.mdp = motDePasseNettoye;
              misAJour = true;
            }
            return p;
          });

          if (misAJour) {
            localStorage.setItem("partenaires", JSON.stringify(partenaires));

            location.reload();
          } else {
            alert("🔑 Nouveau mot de passe généré : " + motDePasseNettoye + "\n(Pensez à le noter et à le transmettre au partenaire).");
          }
        }
      }
    });

  });

<!-- SYSTEME DE VERROUILLAGE DU MOT DE PASSE PARTENAIRE -->
<script>
(function() {
  // Attente du chargement
  window.addEventListener("load", function() {
    
    // Interception des clics en phase de capture pour bloquer le script par défaut
    document.body.addEventListener("click", function(e) {
      
      let cible = e.target;
      if (cible && cible.innerText && cible.innerText.includes("Réinitialiser mot de passe")) {
        
        // Bloquer immédiatement l'action automatique par défaut
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();

        // 1. Demander le mot de passe personnalisé
        let nouveauMdp = prompt("Entrez le NOUVEAU mot de passe personnalisé pour ce partenaire :");

        if (nouveauMdp && nouveauMdp.trim() !== "") {
          let mdpFixe = nouveauMdp.trim();

          // 2. Récupérer le nom du partenaire concerné dans le bloc HTML
          let blocPartenaire = cible.closest("div") || cible.parentElement;
          let texteBloc = blocPartenaire ? blocPartenaire.innerText : "";

          // 3. Mettre à jour la base de données locale (localStorage)
          let partenaires = JSON.parse(localStorage.getItem("partenaires")) || [];
          let trouve = false;

          partenaires = partenaires.map(p => {
            // Vérification si le nom ou le code correspond
            if (texteBloc.includes(p.nom) || (p.code && texteBloc.includes(p.code))) {
              p.mdp = mdpFixe;
              p.pass = mdpFixe; // Sécurité si la clé s'appelle 'pass'
              trouve = true;
            }
            return p;
          });

          // Sauvegarde forcée
          localStorage.setItem("partenaires", JSON.stringify(partenaires));

          // 4. Mettre à jour l'affichage de l'écran pour éviter le retour au code aléatoire
          let zoneMdp = document.querySelector(".mdp-temporaire") || document.querySelector("#temp-pass");
          if (zoneMdp) {
            zoneMdp.innerText = mdpFixe;
          }

          alert("✅ Mot de passe enregistré avec succès : " + mdpFixe);
          location.reload();
        }
      }
    }, true); // Le 'true' permet d'attraper le clic avant le script d'origine

  });
})();
        </script>
  <script>
(function() {
  // 1. Désactivation des popups automatiques par défaut qui affichent les codes aléatoires
  const alertOriginale = window.alert;
  window.alert = function(message) {
    if (message && typeof message === 'string') {
      // Bloque les messages contenant les codes générés automatiquement
      if (message.includes("Nouveau mot de passe pour") || message.includes("Pensez à le noter") || /:[ A-Z0-9]{8}/.test(message)) {
        return; 
      }
    }
    alertOriginale(message);
  };

  // 2. Interception prioritaire lors du clic sur "Réinitialiser mot de passe"
  document.addEventListener("click", function(e) {
    let element = e.target;
    
    if (element && element.innerText && element.innerText.trim().includes("Réinitialiser mot de passe")) {
      // Stoppe net le script par défaut de l'admin
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();

      // Fenêtre pour choisir votre propre mot de passe
      let nouveauMdp = prompt("Saisissez le mot de passe de votre choix pour ce partenaire :");

      if (nouveauMdp && nouveauMdp.trim() !== "") {
        let mdpChoisi = nouveauMdp.trim();

        // Trouver le bloc du partenaire dans le DOM
        let carte = element.closest(".partenaire-card") || element.closest("div") || element.parentElement;
        let texteCarte = carte ? carte.innerText : "";

        // Mettre à jour les données dans LocalStorage (toutes les clés possibles)
        ["partenaires", "partners", "liste_partenaires"].forEach(function(cle) {
          let liste = JSON.parse(localStorage.getItem(cle)) || [];
          if (Array.isArray(liste) && liste.length > 0) {
            liste.forEach(function(p) {
              if (texteCarte.includes(p.nom) || (p.code && texteCarte.includes(p.code))) {
                p.mdp = mdpChoisi;
                p.pass = mdpChoisi;
                p.password = mdpChoisi;
                p.tempPass = mdpChoisi;
              }
            });
            localStorage.setItem(cle, JSON.stringify(liste));
          }
        });

        alertOriginale("✅ Mot de passe modifié avec succès : " + mdpChoisi);
        location.reload();
      }
    }
  }, true); // Le flag 'true' capture le clic avant le code standard
})();

<script>
(function() {
  // 1. Forcer la suppression des alertes automatiques générées par l'ancien script
  const oldAlert = window.alert;
  window.alert = function(msg) {
    if (msg && typeof msg === 'string' && (msg.includes("Nouveau mot de passe pour") || msg.includes("Pensez à le noter"))) {
      return; // Annule le pop-up automatique
    }
    oldAlert(msg);
  };

  // 2. Traitement du changement de mot de passe
  function corrigerInterface() {
    let tousLesBoutons = document.querySelectorAll("button");
    tousLesBoutons.forEach(function(btn) {
      if (btn.innerText && (btn.innerText.includes("Réinitialiser") || btn.innerText.includes("mot de passe")) && !btn.classList.contains("btn-modifier-mdp-fixe")) {
        
        // On masque l'ancien bouton
        btn.style.display = "none";

        // On injecte le nouveau bouton si pas encore présent
        if (!btn.parentNode.querySelector(".btn-modifier-mdp-fixe")) {
          let nBtn = document.createElement("button");
          nBtn.type = "button";
          nBtn.className = "btn-modifier-mdp-fixe";
          nBtn.innerText = "✏️ Changer le mot de passe";

          nBtn.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();

            let mdp = prompt("Saisissez le NOUVEAU mot de passe pour ce partenaire :");
            if (mdp && mdp.trim() !== "") {
              let nouveauMdp = mdp.trim();
              let carte = btn.closest("div") || btn.parentElement;
              let txt = carte ? carte.innerText : "";

              // Mise à jour directe des bases locales
              ["partenaires", "partners", "users"].forEach(function(k) {
                let d = JSON.parse(localStorage.getItem(k)) || [];
                if (Array.isArray(d)) {
                  d.forEach(function(p) {
                    if (txt.includes(p.nom) || (p.code && txt.includes(p.code))) {
                      p.mdp = nouveauMdp;
                      p.pass = nouveauMdp;
                      p.password = nouveauMdp;
                    }
                  });
                  localStorage.setItem(k, JSON.stringify(d));
                }
              });

              oldAlert("✅ Mot de passe enregistré : " + nouveauMdp);
              location.reload();
            }
          };

          btn.parentNode.insertBefore(nBtn, btn.nextSibling);
        }
      }
    });
  }

  // Lancement automatique
  document.addEventListener("DOMContentLoaded", corrigerInterface);
  window.addEventListener("load", corrigerInterface);
  setInterval(corrigerInterface, 1000);
})();
</script>
